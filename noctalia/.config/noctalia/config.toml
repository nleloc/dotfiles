# i took this config in ~/.local/state/noctalia/settings.toml, change a few lines and put it here :D
config_version = 8

[accessibility]
ui_scale = 1.05

[bar.default]
background_opacity = 0.65
end = [ "tray", "group:g2", "group:g1" ]
layer = "overlay"
margin_ends = 0
position = "left"
radius_bottom_left = 0
radius_top_left = 0
scale = 1.2
shadow = false
start = [ "workspaces", "media" ]
thickness = 45

    [[bar.default.capsule_group]]
    enabled = true
    fill = "hover"
    id = "g1"
    members = [ "battery", "volume", "session" ]
    opacity = 0.35
    padding = 6.0

    [[bar.default.capsule_group]]
    enabled = true
    fill = "hover"
    id = "g2"
    members = [ "network", "bluetooth" ]
    opacity = 0.35
    padding = 6.0

[control_center]
hidden_tabs = [ "monitor", "weather", "screen-time" ]

[desktop_widgets]
enabled = false

[location]
address = ""
custom_schedule = true
sunrise = "07:30"
sunset = "20:45"

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [
    "lockscreen-login-box",
    "lockscreen-widget-0000000000000001",
    "lockscreen-widget-0000000000000004",
    "lockscreen-widget-0000000000000006"
]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box"]
    box_height = 128.0
    box_width = 720.0
    cx = 683.0
    cy = 480.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-2".settings]
        background_color = "surface_variant"
        background_opacity = 0.7
        background_radius = 12.0
        center_password_text = true
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = false
        show_session_buttons = true
        show_unlock_hint = false
        show_weather = false

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000001]
    box_height = 192.0
    box_width = 608.0
    cx = 683.0
    cy = 144.0
    rotation = 0.0
    type = "clock"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000001.settings]
        background = true
        background_color = "surface"
        background_opacity = 0.3
        background_padding = 20
        background_radius = 20
        center_text = true
        clock_style = "digital"
        color = "error"
        font_family = "Cascadia Code"
        format = "{:%H:%M:%S}"
        shadow = false

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000004]
    box_height = 16.0
    box_width = 192.0
    cx = 683.0
    cy = 72.0
    rotation = 0.0
    type = "clock"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000004.settings]
        background = false
        background_opacity = 0.25
        font_family = "Cascadia Code"
        format = "it's {:%d %b, %Y}"
        shadow = false

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000006]
    box_height = 160.0
    box_width = 416.0
    cx = 1147.0
    cy = 672.0
    rotation = 0.0
    type = "media_player"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000006.settings]
        background_opacity = 0.5
        background_padding = 12
        background_radius = 12
        hide_when_no_media = true
        shadow = false

[nightlight]
enabled = true
temperature_day = 5400

[shell]
font_family = "Comfy Feeling Viethoa"
show_location = false

    [shell.panel]
    control_center_placement = "floating"

[theme]
community_palette = "Atuel"
source = "community"

    [theme.templates]
    enable_builtin_templates = false
    enable_community_templates = false

[wallpaper]
directory = "/home/nleloc/Pictures/Wallpapers"

    [wallpaper.default]
    path = "/home/nleloc/Pictures/Wallpapers/aaaa-e.jpg"
[weather]
enabled = false

[widget.clock]
scale = 1.35

[widget.network]
show_label = false
vpn_status = "both"

[widget.volume]
show_label = false

[widget.workspaces]
active_pill_size = 2.8
display = "name"
labels_only_when_occupied = true
pill_scale = 0.95
